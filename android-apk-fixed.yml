name: Build FocusGuard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack FocusGuard source
        run: |
          rm -rf /tmp/focusguard-src
          mkdir -p /tmp/focusguard-src
          unzip -q FocusGuard-source.zip -d /tmp/focusguard-src

          if [ -d "/tmp/focusguard-src/FocusGuard" ]; then
            cp -a /tmp/focusguard-src/FocusGuard/. ./
          else
            cp -a /tmp/focusguard-src/. ./
          fi

      - name: Update Android build plugins
        run: |
          sed -i 's/com.android.application") version "8.10.2"/com.android.application") version "8.13.2"/' build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.android") version "2.0.21"/org.jetbrains.kotlin.android") version "2.3.21"/' build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.plugin.compose") version "2.0.21"/org.jetbrains.kotlin.plugin.compose") version "2.3.21"/' build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
